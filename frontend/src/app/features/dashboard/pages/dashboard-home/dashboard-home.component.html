@if (view(); as v) {
  <section class="dashboard">
    <app-summary-cards [balance]="v.balance" />

    <div class="charts-row">
      <div class="chart-col">
        <app-income-vs-expense-chart [data]="v.incomeVsExpense" />
      </div>

      <div class="chart-col">
        <app-category-distribution-chart [data]="v.categoryDistribution" />
      </div>
    </div>

    <div class="chart-full">
      <app-monthly-evolution-chart [data]="v.monthlyEvolution" />
    </div>

    <div class="chart-full">
      <app-monthly-evolution-chart
        [data]="v.patrimonyEvolution"
        title="Evolução do Patrimônio"
        subtitle="Patrimônio acumulado — últimos 12 meses"
        accentColor="#7c3aed"
      />
    </div>
  </section>
}
